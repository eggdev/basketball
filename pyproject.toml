[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-basketball"
version = "0.1.0"
description = "Fantrax league history validation and normalization"
requires-python = ">=3.11"

[project.scripts]
fantasy-import = "fantasy_basketball.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
